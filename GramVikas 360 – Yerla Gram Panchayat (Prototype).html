else if(AT=="proj")b='<div class="card">'+L("See projects","प्रकल्प पाहा")+': <button class="btn s" onclick="go(\'dev\')">'+L("Village Development","गावाचा विकास")+'</button></div>';
else b='<div class="card">'+L("Prototype module – not built in this demo.","प्रोटोटाइप मॉड्यूल – या डेमोमध्ये नाही.")+'</div>';

var AT="dash";
function initMap(){var m=document.getElementById("map");if(!m)return;S.pin={x:150,y:90};m.onclick=function(e){var r=m.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.height*170;S.pin={x:x,y:y};document.getElementById("pin").setAttribute("transform","translate("+(x-150)+","+(y-90)+")")}}
function prev(i){var f=i.files[0],im=document.getElementById("pv");if(f){im.src=URL.createObjectURL(f);im.style.display="block"}}
function submitC(){var t=document.getElementById("rt").value.trim(),d=document.getElementById("rd").value.trim();if(!t||!d)return toast(L("Please fill title and description","कृपया शीर्षक व वर्णन भरा"));
var n=Math.max.apply(null,S.c.map(function(c){return+c.id.slice(4)}))+1,id="TKT-"+n;
S.c.unshift({id:id,t:t,cat:document.getElementById("rc").value,w:+document.getElementById("rw").value,p:document.getElementById("rp").value,d:new Date().toISOString().slice(0,10),s:0,v:1,me:1,ds:d});S.up[id]=1;note("Your complaint "+id+" has been submitted.","तुमची तक्रार "+id+" सादर झाली आहे.");save();
modal('<h2>✅ '+L("Complaint Submitted Successfully","तक्रार यशस्वीरित्या सादर")+'</h2><p>'+L("Ticket ID","तिकीट क्रमांक")+':<br><b style="font-size:1.8rem;color:var(--g)">'+id+'</b></p><p>'+L("Your complaint has been registered and forwarded to the Gram Panchayat.","तुमची तक्रार नोंदवली असून ग्रामपंचायतीकडे पाठवली आहे.")+'</p><button class="btn" onclick="closeM();trk(\''+id+'\')">'+L("Track Complaint","तक्रार ट्रॅक करा")+'</button> <button class="btn o" onclick="closeM();go(\'dash\')">'+L("Back to Dashboard","डॅशबोर्डवर परत")+'</button>')}
function view(id){var c=S.c.filter(function(x){return x.id==id})[0];modal('<h3>'+c.id+'</h3><p><b>'+tt(c)+'</b></p><p>'+esc(c.ds)+'</p><p>'+cn(c.cat)+' • '+L("Ward","वार्ड")+' '+c.w+' • '+bd(c.s)+'</p><button class="btn" onclick="closeM()">OK</button>')}

function cert(){var D={"YERLA-BC-2026-1042":[1,"Birth Certificate"],"YERLA-RC-2026-0877":[3,"Residence Certificate"],"YERLA-DC-2026-0311":[2,"Death Certificate"],"YERLA-BPL-2026-0155":[0,"BPL Certificate"]},id=document.getElementById("ai").value.trim().toUpperCase(),d=D[id],o=document.getElementById("cr"),N=[["Submitted","सादर केले"],["Under Verification","पडताळणीत"],["Approved","मंजूर"],["Ready for Download","डाउनलोडसाठी तयार"]];

o.innerHTML='<h3>'+d[1]+'</h3><p><span class="bd s'+(d[0]+1)+'">'+L(N[d[0]][0],N[d[0]][1])+'</span></p>'+tl(d[0],[L("Application Submitted","अर्ज सादर"),L("Document Verification","कागदपत्र पडताळणी"),L("Gram Panchayat Approval","ग्रामपंचायत मंजुरी"),L("Certificate Ready","प्रमाणपत्र तयार")])+(d[0]==3?'<button class="btn y" onclick="dl(\'certificate-demo.txt\',\'DEMO CERTIFICATE (not official)\\n'+d[1]+'\\n'+id+'\\nYerla Gram Panchayat - prototype\')">'+L("Download Demo Copy","डेमो प्रत डाउनलोड")+'</button>':'')}
function dl(n,t){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=n;a.click()}
function qr(){var s="",k=7;for(var i=0;i<21;i++)for(var j=0;j<21;j++){var f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);if(f?(i%6==0||j%6==0||(i>1&&i<5&&j%14>1&&j%14<5)):((i*7+j*13+i*j)%5<2))s+='<rect x="'+j*k+'" y="'+i*k+'" width="7" height="7"/>'}return '<svg viewBox="0 0 147 147" width="150" style="display:block;margin:auto;border:6px solid #fff;outline:1px solid #ccc">'+s+'</svg>'}
function payM(){modal('<h3>UPI Payment – Demo</h3><p class="dis">'+L("Demonstration only. No real payment is processed.","फक्त प्रात्यक्षिक. कोणतेही खरे पेमेंट होत नाही.")+'</p>'+qr()+'<p style="text-align:center"><b>₹1,700</b></p><div class="chips" style="justify-content:center"><span class="chip">Google Pay</span><span class="chip">PhonePe</span><span class="chip">Paytm</span></div><input placeholder="UPI ID (demo@upi)"><p><button class="btn y" onclick="pay()">'+L("Simulate Payment","पेमेंट सिम्युलेट करा")+'</button> <button class="btn o" onclick="closeM()">'+L("Cancel","रद्द")+'</button></p>')}
function pay(){S.paid=1;note("Your water tax payment receipt YRL-TAX-2026-0042 is ready.","तुमची पाणीपट्टी पावती YRL-TAX-2026-0042 तयार आहे.");save();modal('<h2>✅ Payment Successful – Demo</h2><p>'+L("Receipt No","पावती क्र.")+': <b>YRL-TAX-2026-0042</b></p><button class="btn y" onclick="rcpt()">'+L("Download Receipt","पावती डाउनलोड")+'</button> <button class="btn o" onclick="closeM();render()">OK</button>')}
function rcpt(){dl("YRL-TAX-2026-0042.txt","YERLA GRAM PANCHAYAT - DEMO RECEIPT (NOT OFFICIAL)\nReceipt No: YRL-TAX-2026-0042\nHousehold Tax YRL-10282: Rs 1250\nWater Tax YRL-W-221: Rs 450\nTotal: Rs 1700\nDate: "+new Date().toLocaleDateString()+"\nStatus: Paid (Demo - no real payment)")}
